name: Verificar AssetCheck Windows

on:
  push:
    branches: [main]
    paths:
      - 'AssetCheck/**'
      - '.github/workflows/assetcheck-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Identificar y usar MSVC x64, CMake y Ninja
        shell: cmd
        run: |
          @echo off
          set "ASSETCHECK_VS="
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "ASSETCHECK_VS=%%I"
          if not defined ASSETCHECK_VS exit /b 1
          call "%ASSETCHECK_VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          if errorlevel 1 exit /b 1
          where cmake
          if errorlevel 1 exit /b 1
          where ninja
          if errorlevel 1 exit /b 1
          cmake --version
          if errorlevel 1 exit /b 1
          ninja --version
          if errorlevel 1 exit /b 1
          cmake -S AssetCheck -B AssetCheck/build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          if errorlevel 1 exit /b 1
          cmake --build AssetCheck/build --parallel 2
          if errorlevel 1 exit /b 1
      - name: Ejecutar las regresiones CTest y conservar sus observaciones
        run: ctest --test-dir AssetCheck/build -C Debug --verbose --output-on-failure
